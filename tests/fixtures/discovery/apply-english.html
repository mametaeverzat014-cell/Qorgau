<h1>English language requirements</h1>
<p>Applicants whose first language is not English must demonstrate English language proficiency.</p>
<h2>Accepted tests</h2>
<p>We require an IELTS minimum overall band of 7.0, with no section below 6.5. The TOEFL iBT minimum is 100.</p>
