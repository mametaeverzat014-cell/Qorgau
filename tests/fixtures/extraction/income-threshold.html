<h1>Affordability</h1>
<p>Undergraduates whose family income is below $200,000 can expect to attend Northbridge tuition-free.</p>
<p>Scholarships of up to $30,000 are available to continuing students.</p>
<h2>Published charges</h2>
<p>For the 2026-27 academic year, tuition is $59,750 per year.</p>
